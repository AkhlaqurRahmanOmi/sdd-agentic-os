name: nightly-discovery

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # No credentials needed: the CLI reports discovered skills in its init
      # event, before any API call. A discovery regression fails here rather
      # than showing up as an agent quietly ignoring the skills.
      - name: Claude Code discovers the generated skills
        run: node scripts/verify-discovery.mjs
